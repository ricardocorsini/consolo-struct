[package]
name = "consolostruct"
version = "0.7.1"
description = "Cálculo ELU e editor de consolos de concreto armado"
authors = ["OpenStruct contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "consolostruct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Consulta do catálogo assinado e download conferido das atualizações (issue #45).
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
